name: voidhand
description: Voidhand remote panel.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  font_awesome_flutter: ^10.7.0
  url_launcher: ^6.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
