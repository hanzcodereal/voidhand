name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (contoh: 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Set version
        run: |
          V="${{ github.event.inputs.version }}"
          sed -i "s/^version:.*/version: ${V}+1/" pubspec.yaml

      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Voidhand-${{ github.event.inputs.version }}
          path: build/app/outputs/flutter-apk/app-release.apk
